<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Rosario — MSc Computer Science</title>

  <!-- page background -->
  <rect x="0" y="0" width="1200" height="360" fill="#EEF2FF"/>

  <!-- drop shadow offset block -->
  <rect x="52" y="52" width="1096" height="256" fill="#111111"/>

  <!-- main teal card -->
  <rect x="40" y="40" width="1096" height="256" fill="#4FD3C6" stroke="#111111" stroke-width="6"/>

  <!-- headline -->
  <text x="80" y="128" font-family="'Courier New', monospace" font-weight="700" font-size="46" fill="#111111">Hello, I'm Rosario</text>

  <!-- subtitle -->
  <text x="80" y="172" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="28" fill="#111111" opacity="0.75">MSc Computer Science</text>

  <!-- tag: Backend Development -->
  <rect x="80" y="212" width="252" height="46" fill="#111111"/>
  <text x="206" y="242" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">BACKEND DEVELOPMENT</text>

  <!-- tag: Application Design -->
  <rect x="348" y="212" width="234" height="46" fill="#111111"/>
  <text x="465" y="242" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">APPLICATION DESIGN</text>

  <!-- tag: Data -->
  <rect x="598" y="212" width="94" height="46" fill="#111111"/>
  <text x="645" y="242" font-family="'Courier New', monospace" font-weight="700" font-size="16" fill="#FFFFFF" text-anchor="middle">DATA</text>
</svg>
